name: orbis_net
description: >-
  Multiplayer for Orbis. Replicates component columns rather than object
  properties, with ownership rules, interpolation and its own transports.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.0

dependencies:
  orbis_core:
    git:
      url: git@github.com:Orbis-Engine/orbis.git
      path: packages/orbis_core
      ref: master

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
